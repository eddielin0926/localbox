name: Publish Vercel-compatible images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu
            tag: ubuntu
          - target: node-22
            tag: node-22
          - target: node-24
            tag: node-24
          - target: node-26
            tag: node-26
          - target: python
            tag: python-3.14
          - target: al-python
            tag: python-al-3.13.1
          - target: universal
            tag: universal
          - target: arch
            tag: arch
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: ./images/vercel
          files: docker-bake.hcl
          targets: ${{ matrix.target }}
          push: true
          set: |
            ${{ matrix.target }}.tags=ghcr.io/eddielin0926/localbox-vercel:${{ matrix.tag }}-b99895b79dd346905166efd83bd86e73a9762c2e
            ${{ matrix.target }}.tags=ghcr.io/eddielin0926/localbox-vercel:${{ matrix.tag }}-latest
