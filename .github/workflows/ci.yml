name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check source and compatibility types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build package
        run: pnpm build

      - name: Test Node resolution preload
        run: pnpm test:resolution

      - name: Test CLI process wrapper
        run: pnpm test:cli

      - name: Validate publish contents
        run: pnpm pack --dry-run

      - name: Render compatibility report
        run: pnpm compatibility:vercel

  process:
    name: Process backend conformance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run process backend conformance and focused tests
        run: pnpm test:process

      - name: Run process backend smoke
        run: pnpm smoke:process

  bwrap:
    name: Bubblewrap backend conformance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Ubuntu hosted runners may restrict unprivileged user namespaces through
    # their outer AppArmor profile. The privileged job container supplies the
    # namespace prerequisite; every Localbox test still runs as an ordinary
    # uid with the backend's unprivileged user-namespace strategy.
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends bubblewrap ca-certificates git util-linux
          useradd --create-home --uid 1000 localbox

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Prepare unprivileged test ownership
        run: chown --recursive localbox:localbox "$GITHUB_WORKSPACE"

      - name: Run bubblewrap conformance and security tests
        run: runuser --user localbox -- env HOME=/home/localbox PATH="$PATH" pnpm test:bwrap

      - name: Run bubblewrap security smoke
        run: runuser --user localbox -- env HOME=/home/localbox PATH="$PATH" pnpm smoke:bwrap

  integration:
    name: Docker integration
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run Docker integration tests
        run: pnpm test:integration

      - name: Run end-to-end smoke example
        run: pnpm smoke

      - name: Run packaged unchanged-import interception smoke
        run: pnpm smoke:interception
