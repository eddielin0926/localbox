name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check source and compatibility types
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build package
        run: pnpm build

      - name: Test Node resolution preload
        run: pnpm test:resolution

      - name: Test CLI process wrapper
        run: pnpm test:cli

      - name: Validate publish contents
        run: pnpm pack --dry-run

      - name: Test packed package installation
        run: pnpm smoke:package

      - name: Render compatibility report
        run: pnpm compatibility:vercel

  process:
    name: Process backend conformance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run process backend conformance and focused tests
        run: pnpm test:process

      - name: Run process backend smoke
        run: pnpm smoke:process

  bwrap:
    name: Bubblewrap backend conformance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Hosted runners restrict unprivileged user namespaces. The privileged,
    # AppArmor-unconfined job container supplies that kernel prerequisite;
    # Localbox and bubblewrap still execute as the ordinary uid 1000.
    container:
      image: ubuntu:24.04
      options: --privileged --security-opt apparmor=unconfined
    steps:
      - name: Install job prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends bubblewrap ca-certificates git util-linux
          chmod 4755 /usr/bin/bwrap
          install --directory --mode=0700 --owner=1000 --group=1000 /tmp/localbox-home

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Prepare unprivileged test ownership
        run: chown --recursive 1000:1000 "$GITHUB_WORKSPACE"

      - name: Run bubblewrap conformance and security tests
        run: setpriv --reuid=1000 --regid=1000 --clear-groups env HOME=/tmp/localbox-home PATH="$PATH" pnpm test:bwrap

      - name: Run bubblewrap security smoke
        run: setpriv --reuid=1000 --regid=1000 --clear-groups env HOME=/tmp/localbox-home PATH="$PATH" pnpm smoke:bwrap

  podman:
    name: Podman ${{ matrix.mode }} conformance
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode:
          - rootless
          - rootful
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Podman and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman uidmap slirp4netns fuse-overlayfs ca-certificates git
          if ! podman unshare true; then
            sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 "$(id -un)"
          fi
          pnpm install --frozen-lockfile

      - name: Start Podman API service
        env:
          PODMAN_MODE: ${{ matrix.mode }}
        run: |
          socket="$RUNNER_TEMP/podman-$PODMAN_MODE.sock"
          if [ "$PODMAN_MODE" = rootless ]; then
            nohup podman system service --time=0 "unix://$socket" >"$RUNNER_TEMP/podman-$PODMAN_MODE.log" 2>&1 &
          else
            sudo nohup podman system service --time=0 "unix://$socket" >"$RUNNER_TEMP/podman-$PODMAN_MODE.log" 2>&1 &
          fi
          for attempt in $(seq 1 100); do
            if [ -S "$socket" ]; then break; fi
            sleep 0.1
          done
          test -S "$socket"
          if [ "$PODMAN_MODE" = rootful ]; then sudo chown "$(id -u):$(id -g)" "$socket"; sudo chmod 0600 "$socket"; fi
          echo "LOCALBOX_PODMAN_SOCKET=$socket" >> "$GITHUB_ENV"
          echo "LOCALBOX_PODMAN_MODE=$PODMAN_MODE" >> "$GITHUB_ENV"

      - name: Run Podman availability and conformance tests
        run: pnpm test:podman

      - name: Diagnose rootful Podman networking
        if: ${{ failure() && matrix.mode == 'rootful' }}
        run: |
          diagnostic_image="ghcr.io/eddielin0926/localbox-vercel:node-24-b99895b79dd346905166efd83bd86e73a9762c2e"
          diagnostic_container="localbox-rootful-network-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup_diagnostic_container() {
            sudo podman rm --force "$diagnostic_container" >/dev/null 2>&1 || true
          }
          trap cleanup_diagnostic_container EXIT

          dpkg-query --show podman netavark aardvark-dns || true
          sudo podman info --debug || true
          sudo podman run --detach --name "$diagnostic_container" --network podman --pull=never \
            "$diagnostic_image" sleep infinity >/dev/null || true

          printf '%s\n' '=== diagnostic container resolver ==='
          sudo podman exec "$diagnostic_container" cat /etc/resolv.conf || true
          printf '%s\n' '=== diagnostic container network settings ==='
          sudo podman inspect --format '{{json .NetworkSettings}}' "$diagnostic_container" || true
          printf '%s\n' '=== diagnostic container routes ==='
          sudo podman exec "$diagnostic_container" sh -c '
            if command -v ip >/dev/null 2>&1; then
              ip -details route show table all
              ip -6 -details route show table all
            else
              cat /proc/net/route
              cat /proc/net/ipv6_route
            fi
          ' || true
          printf '%s\n' '=== diagnostic container github.com lookup ==='
          sudo podman exec "$diagnostic_container" sh -c '
            if command -v getent >/dev/null 2>&1; then
              getent ahosts github.com
            else
              node -e "require(\"node:dns\").lookup(\"github.com\", { all: true }, (error, addresses) => { if (error) { console.error(error.message); process.exitCode = 1; } else { console.log(addresses); } })"
            fi
          ' || true

          printf '%s\n' '=== rootful default Podman network ==='
          sudo podman network inspect podman || true
          printf '%s\n' '=== rootful UDP listeners ==='
          sudo ss --listening --numeric --udp --processes | sed -n '1,200p' || true
          printf '%s\n' '=== iptables Netavark/NAT/forward counters ==='
          if command -v iptables-save >/dev/null 2>&1; then
            sudo iptables-save --counters 2>/dev/null \
              | grep -E '(^\*|^:|NETAVARK|netavark|podman|FORWARD|PREROUTING|POSTROUTING|MASQUERADE|COMMIT)' \
              | sed -n '1,400p' || true
          else
            printf '%s\n' 'iptables-save unavailable'
          fi
          printf '%s\n' '=== nftables Netavark/NAT/forward counters ==='
          if command -v nft >/dev/null 2>&1; then
            sudo nft --handle list ruleset 2>/dev/null \
              | grep -Ei -C 3 'netavark|podman|dns|forward|prerouting|postrouting|masquerade|counter' \
              | sed -n '1,400p' || true
          else
            printf '%s\n' 'nft unavailable'
          fi
          printf '%s\n' '=== rootful Podman service log (last 500 lines, sensitive fields filtered) ==='
          tail --lines=500 "$RUNNER_TEMP/podman-rootful.log" \
            | sed -E \
              -e '/Authorization|Cookie|X-Registry-Auth|"Env"[[:space:]]*:/Id' \
              -e 's#https?://[^[:space:]"]+#[redacted-url]#g' \
              -e 's#\?[^[:space:]"]+#?[redacted-query]#g' || true

  integration:
    name: Docker integration
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.2.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Run Docker integration tests
        run: pnpm test:integration

      - name: Run end-to-end smoke example
        run: pnpm smoke

      - name: Run packaged unchanged-import interception smoke
        run: pnpm smoke:interception
